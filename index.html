<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITech — Coming Soon</title>

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.64);
      --line: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.055), transparent 34%),
        radial-gradient(circle at 76% 80%, rgba(255, 255, 255, 0.03), transparent 30%);
      pointer-events: none;
    }

    .page {
      width: min(1200px, 94vw);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 20px;
      position: relative;
      z-index: 1;
    }

    .card {
      text-align: center;
      animation: fadeUp 0.9s ease-out both;
      transform: translateY(-2vh);
    }

    .logo {
      width: min(950px, 90vw);
      height: auto;
      display: block;
      margin: 0 auto 26px;
      opacity: 0.96;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.09));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      margin: 0 auto 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.8vw, 4.4rem);
      line-height: 1.05;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 800;
    }

    p {
      margin: 22px auto 0;
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 28px;
      text-align: center;
      color: rgba(255, 255, 255, 0.38);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 2;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(-2vh);
      }
    }

    @media (max-width: 760px) {
      .card {
        transform: translateY(-1vh);
      }

      .logo {
        width: min(760px, 92vw);
        margin-bottom: 24px;
      }

      h1 {
        font-size: clamp(2rem, 9vw, 3.6rem);
        letter-spacing: 0.07em;
      }

      p {
        font-size: 1rem;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(-1vh);
        }
      }
    }

    @media (max-width: 560px) {
      .page {
        padding: 34px 18px;
      }

      .logo {
        width: 94vw;
        margin-bottom: 22px;
      }

      .divider {
        margin-bottom: 22px;
      }

      .footer {
        bottom: 18px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-label="ITech coming soon">
      <img class="logo" src="logo-transparent.png" alt="ITech logo" />
      <div class="divider"></div>
      <h1>Coming Soon</h1>
      <p>We are preparing something new. Our website is under construction and will be available soon.</p>
    </section>

    <div class="footer">ITech · Launching Soon</div>
  </main>
</body>
</html>
